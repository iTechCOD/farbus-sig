<svg xmlns="http://www.w3.org/2000/svg" width="1980" height="700" viewBox="0 0 1980 700"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9" fill="none" stroke="#6b7280" stroke-width="1.4"/></marker></defs><rect width="1980" height="700" fill="#ffffff"/><text x="40" y="38" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933">Figura 2 — BPMN AS-IS. Proceso 2: Consolidacion quincenal y facturacion</text><text x="40" y="58" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d">Continuacion del Proceso 1. La facturacion se emite por vuelta ejecutada, con un valor determinado por ruta</text><rect x="40" y="78" width="1900" height="312" fill="none" stroke="#1f2933" stroke-width="2"/><rect x="40" y="78" width="30" height="312" fill="#e4e7eb" stroke="#1f2933" stroke-width="2"/><text x="60" y="234.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle" transform="rotate(-90 60 234.0)">Sociedad de Transportes Farbus Ltda.</text><rect x="70" y="78" width="1870" height="192" fill="none" stroke="#1f2933" stroke-width="1"/><rect x="70" y="78" width="28" height="192" fill="#f0f2f4" stroke="#1f2933" stroke-width="1"/><text x="78.0" y="174.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#1f2933" text-anchor="middle" transform="rotate(-90 78.0 174.0)">Administracion de</text><text x="90.0" y="174.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#1f2933" text-anchor="middle" transform="rotate(-90 90.0 174.0)">Logistica</text><rect x="70" y="270" width="1870" height="120" fill="none" stroke="#1f2933" stroke-width="1"/><rect x="70" y="270" width="28" height="120" fill="#f0f2f4" stroke="#1f2933" stroke-width="1"/><text x="84.0" y="330.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#1f2933" text-anchor="middle" transform="rotate(-90 84.0 330.0)">Contabilidad</text><rect x="40" y="406" width="1900" height="116" fill="none" stroke="#1f2933" stroke-width="2"/><rect x="40" y="406" width="30" height="116" fill="#e4e7eb" stroke="#1f2933" stroke-width="2"/><text x="60" y="464.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle" transform="rotate(-90 60 464.0)">Empresa cliente</text><circle cx="122" cy="148" r="18" fill="#ffffff" stroke="#1f2933" stroke-width="2"/><circle cx="122" cy="148" r="8" fill="none" stroke="#1f2933" stroke-width="1.3"/><path d="M122,143 L122,148 L126,151" fill="none" stroke="#1f2933" stroke-width="1.3"/><text x="122" y="179" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1f2933" text-anchor="middle">Cada 15 dias</text><rect x="176.0" y="117.0" width="158" height="62" rx="8" ry="8" fill="#fdecea" stroke="#b42318" stroke-width="1.8"/><text x="255" y="136" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">Consolidar recorridos</text><text x="255" y="148" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">ejecutados por</text><text x="255" y="160" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">cliente</text><text x="184.0" y="172.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b42318">&#9995;</text><rect x="346.0" y="117.0" width="158" height="62" rx="8" ry="8" fill="#fdecea" stroke="#b42318" stroke-width="1.8"/><text x="425" y="136" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">Trasladar planillas</text><text x="425" y="148" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">entre equipos por</text><text x="425" y="160" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">pendrive</text><text x="354.0" y="172.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b42318">&#9995;</text><rect x="516.0" y="117.0" width="158" height="62" rx="8" ry="8" fill="#fdecea" stroke="#b42318" stroke-width="1.8"/><text x="595" y="142" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">Imprimir registro de</text><text x="595" y="154" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">servicios prestados</text><text x="524.0" y="172.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b42318">&#9995;</text><rect x="686.0" y="117.0" width="158" height="62" rx="8" ry="8" fill="#fdecea" stroke="#b42318" stroke-width="1.8"/><text x="765" y="142" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">Sumar servicios segun</text><text x="765" y="154" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">el valor de cada ruta</text><text x="694.0" y="172.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b42318">&#9995;</text><rect x="1576.0" y="199.0" width="168" height="58" rx="8" ry="8" fill="#fdecea" stroke="#b42318" stroke-width="1.8"/><text x="1660" y="216" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">Verificar manualmente</text><text x="1660" y="228" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">contra planillas y</text><text x="1660" y="240" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">papeles de respaldo</text><text x="1584.0" y="250.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b42318">&#9995;</text><circle cx="1830" cy="228" r="18" fill="#ffffff" stroke="#1f2933" stroke-width="3.2"/><text x="1830" y="259" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1f2933" text-anchor="middle">Reclamo resuelto</text><rect x="856.0" y="299.0" width="158" height="62" rx="8" ry="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/><text x="935" y="318" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">Recibir planillas y</text><text x="935" y="330" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">preparar resumen de</text><text x="935" y="342" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">montos</text><text x="864.0" y="354.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933">&#9995;</text><rect x="1026.0" y="299.0" width="158" height="62" rx="8" ry="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/><text x="1105" y="328" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">Emitir factura al</text><text x="1105" y="340" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">cliente</text><rect x="1196.0" y="433.0" width="158" height="62" rx="8" ry="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/><text x="1275" y="462" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">Recibir y revisar</text><text x="1275" y="474" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">factura</text><polygon points="1425,441 1448,464 1425,487 1402,464" fill="#fffdf5" stroke="#1f2933" stroke-width="1.8"/><path d="M1415.34,454.34 L1434.66,473.66 M1434.66,454.34 L1415.34,473.66" stroke="#1f2933" stroke-width="2.2" fill="none"/><text x="1425" y="422" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#1f2933" text-anchor="middle">Discrepancia en el</text><text x="1425" y="433" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#1f2933" text-anchor="middle">cobro?</text><circle cx="1565" cy="464" r="18" fill="#ffffff" stroke="#1f2933" stroke-width="3.2"/><text x="1565" y="495" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1f2933" text-anchor="middle">Facturacion</text><text x="1565" y="506" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1f2933" text-anchor="middle">conforme</text><path d="M140,148 L176,148" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><path d="M334,148 L346,148" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><path d="M504,148 L516,148" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><path d="M674,148 L686,148" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><path d="M844,148 L935,148 L935,299" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><path d="M1014,330 L1026,330" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><path d="M1184,330 L1275,330 L1275,433" fill="none" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#ah)"/><path d="M1354,464 L1402,464" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><path d="M1448,464 L1547,464" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><rect x="1482" y="446" width="30" height="14" fill="#ffffff" opacity="0.9"/><text x="1497" y="456" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#1f2933" text-anchor="middle">No</text><path d="M1425,487 L1425,520 L1660,520 L1660,257" fill="none" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#ah)"/><rect x="1428" y="495" width="30" height="14" fill="#ffffff" opacity="0.9"/><text x="1443" y="505" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#1f2933" text-anchor="middle">Si</text><path d="M1744,228 L1812,228" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><path d="M384.0,308.0 a41.0,10 0 0,1 82,0 v44 a41.0,10 0 0,1 -82,0 z" fill="#f7f8f9" stroke="#1f2933" stroke-width="1.4"/><path d="M384.0,308.0 a41.0,10 0 0,0 82,0" fill="none" stroke="#1f2933" stroke-width="1.4"/><text x="425" y="316.5" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#1f2933" text-anchor="middle">Excel</text><text x="425" y="327.5" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#1f2933" text-anchor="middle">Trafico</text><text x="425" y="338.5" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#1f2933" text-anchor="middle">Vehiculos</text><text x="425" y="349.5" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#1f2933" text-anchor="middle">Sueldos</text><path d="M425,179 L425,298" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#ahd)"/><rect x="90" y="560" width="430" height="96" rx="4" fill="#fdecea" stroke="#b42318" stroke-width="1" opacity="0.95"/><text x="98" y="576" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">Latencia de 15 dias. El</text><text x="98" y="588" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">consolidado que sustenta la</text><text x="98" y="600" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">facturacion se entrega</text><text x="98" y="612" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">quincenalmente, de modo que</text><text x="98" y="624" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">cualquier discrepancia se detecta</text><text x="98" y="636" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">hasta dos semanas despues de</text><text x="98" y="648" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">ocurrido el servicio.</text><rect x="560" y="560" width="430" height="72" rx="4" fill="#fdecea" stroke="#b42318" stroke-width="1" opacity="0.95"/><text x="568" y="576" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">Cuatro planillas sin integracion,</text><text x="568" y="588" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">trasladadas por pendrive. No</text><text x="568" y="600" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">existe una fuente unica de verdad</text><text x="568" y="612" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">ni control de versiones entre los</text><text x="568" y="624" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">equipos.</text><rect x="1030" y="560" width="430" height="60" rx="4" fill="#fdecea" stroke="#b42318" stroke-width="1" opacity="0.95"/><text x="1038" y="576" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">El calculo del monto a facturar se</text><text x="1038" y="588" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">realiza sobre un registro impreso,</text><text x="1038" y="600" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">sumando manualmente los servicios</text><text x="1038" y="612" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">por el valor de cada ruta.</text><rect x="1500" y="560" width="430" height="72" rx="4" fill="#fdecea" stroke="#b42318" stroke-width="1" opacity="0.95"/><text x="1508" y="576" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">La verificacion de un reclamo</text><text x="1508" y="588" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">obliga a reconstruir la</text><text x="1508" y="600" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">trazabilidad desde el papel de</text><text x="1508" y="612" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">origen, sin consulta directa por</text><text x="1508" y="624" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">vuelta, conductor o fecha.</text></svg>