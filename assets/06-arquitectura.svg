font-weight="bold" fill="#1f2933">Consolidado de cobro</text><text x="878" y="591" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d">Vueltas por contrato y tarifa vigente</text><rect x="1262" y="546" width="370" height="104" rx="7" fill="#ffffff" stroke="#8a5a00" stroke-width="1.3"/><text x="1278" y="570" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1f2933">Alertas de flota</text><text x="1278" y="591" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d">Umbral de kilometraje y vencimiento de</text><text x="1278" y="605" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d">documentos</text><rect x="40" y="700" width="1620" height="170" rx="10" fill="#f6eafa" stroke="#7b2d8e" stroke-width="1.8"/><text x="62" y="728" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#7b2d8e">4. Interfaz</text><rect x="62" y="746" width="370" height="104" rx="7" fill="#ffffff" stroke="#7b2d8e" stroke-width="1.3"/><text x="78" y="770" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1f2933">Aplicacion web de escritorio</text><text x="78" y="791" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d">Uso en oficina por Administracion de</text><text x="78" y="805" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d">Logistica</text><rect x="462" y="746" width="370" height="104" rx="7" fill="#ffffff" stroke="#7b2d8e" stroke-width="1.3"/><text x="478" y="770" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1f2933">Tablero de indicadores</text><text x="478" y="791" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d">Operacion del dia, flota y cobro por</text><text x="478" y="805" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d">contrato</text><rect x="862" y="746" width="370" height="104" rx="7" fill="#ffffff" stroke="#7b2d8e" stroke-width="1.3"/><text x="878" y="770" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1f2933">Hoja de ruta imprimible</text><text x="878" y="791" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d">Generada precargada para el conductor</text><rect x="1262" y="746" width="370" height="104" rx="7" fill="#ffffff" stroke="#7b2d8e" stroke-width="1.3"/><text x="1278" y="770" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1f2933">Exportacion a Excel y PDF</text><text x="1278" y="791" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d">Compatibilidad con la operacion actual</text><path d="M850,270 L850,300" stroke="#1f2933" stroke-width="2" marker-end="url(#ah)"/><path d="M850,470 L850,500" stroke="#1f2933" stroke-width="2" marker-end="url(#ah)"/><path d="M850,670 L850,700" stroke="#1f2933" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="890" width="1620" height="64" rx="8" fill="#f7f8f9" stroke="#1f2933" stroke-width="1.5"/><text x="62" y="916" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933">Stack tentativo Entrega 2 (localhost reproducible)</text><text x="62" y="938" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d">Python 3.12 · FastAPI · SQLAlchemy + Alembic · PostgreSQL 16 · Jinja2 + HTMX + Bootstrap 5 · Pandas para carga inicial · Docker Compose (app + base de datos) · Pytest · Git y GitHub</text></svg>