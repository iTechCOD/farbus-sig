xt><text x="1218.0" y="382.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1b4f9c">&#9881;</text><rect x="1405.0" y="437.0" width="150" height="62" rx="8" ry="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/><text x="1480" y="466" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">Resolver y ajustar el</text><text x="1480" y="478" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">cobro</text><circle cx="1625" cy="468" r="18" fill="#ffffff" stroke="#1f2933" stroke-width="3.2"/><text x="1625" y="499" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1f2933" text-anchor="middle">Reclamo resuelto</text><circle cx="1740" cy="272" r="18" fill="#ffffff" stroke="#1f2933" stroke-width="2"/><circle cx="1740" cy="272" r="8" fill="none" stroke="#1f2933" stroke-width="1.3"/><path d="M1740,267 L1740,272 L1744,275" fill="none" stroke="#1f2933" stroke-width="1.3"/><text x="1740" y="303" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1f2933" text-anchor="middle">Control diario de</text><text x="1740" y="314" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1f2933" text-anchor="middle">flota</text><rect x="1791.0" y="241.0" width="158" height="62" rx="8" ry="8" fill="#eaf1fb" stroke="#1b4f9c" stroke-width="1.8"/><text x="1870" y="260" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">Evaluar kilometraje y</text><text x="1870" y="272" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">vencimiento de</text><text x="1870" y="284" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">documentos</text><text x="1799.0" y="296.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1b4f9c">&#9881;</text><polygon points="2010,249 2033,272 2010,295 1987,272" fill="#fffdf5" stroke="#1f2933" stro