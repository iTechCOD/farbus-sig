pacity="0.95"/><text x="98" y="706" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b7a3d">Latencia eliminada. El consolidado</text><text x="98" y="718" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b7a3d">por contrato deja de construirse</text><text x="98" y="730" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b7a3d">cada quince dias y pasa a estar</text><text x="98" y="742" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b7a3d">disponible de forma permanente, de</text><text x="98" y="754" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b7a3d">modo que el cobro se emite sobre</text><text x="98" y="766" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b7a3d">datos ya conciliados.</text><rect x="650" y="690" width="520" height="84" rx="4" fill="#e8f5e9" stroke="#1b7a3d" stroke-width="1" opacity="0.95"/><text x="658" y="706" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b7a3d">La resolucion de un reclamo deja</text><text x="658" y="718" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b7a3d">de requerir la busqueda del papel</text><text x="658" y="730" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b7a3d">de origen: el sistema recupera la</text><text x="658" y="742" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b7a3d">trazabilidad completa de la vuelta</text><text x="658" y="754" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b7a3d">cuestionada mediante consulta</text><text x="658" y="766" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b7a3d">directa.</text><rect x="1210" y="690" width="520" height="84" rx="4" fill="#e8f5e9" stroke="#1b7a3d" stroke-width="1" opacity="0.95"/><text x="1218" y="706" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b7a3d">Control de flota inexistente en el</text><text x="1218" y="718" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b7a3d">AS-IS. El sistema evalua a diario</text><text x="1218" y="730" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b7a3d">el kilometraje acumulado y los</text><text x="1218" y="742" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b7a3d">vencimientos de revision tecnica,</text><text x="1218" y="754" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b7a3d">permiso de circulacion y seguro, y</text><text x="1218" y="766" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b7a3d">genera la alerta anticipada.</text><rect x="1770" y="690" width="470" height="72" rx="4" fill="#e8f5e9" stroke="#1b7a3d" stroke-width="1" opacity="0.95"/><text x="1778" y="706" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b7a3d">La mantencion pasa de reactiva a</text><text x="1778" y="718" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b7a3d">programada. El disparador deja de</text><text x="1778" y="730" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b7a3d">ser la falla del vehiculo y pasa a</text><text x="1778" y="742" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b7a3d">ser el umbral de kilometraje</text><text x="1778" y="754" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b7a3d">definido por tipo de unidad.</text></svg>