rato en linea</text><text x="204.0" y="296.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1b4f9c">&#9881;</text><rect x="371.0" y="117.0" width="158" height="62" rx="8" ry="8" fill="#e8f5e9" stroke="#1b7a3d" stroke-width="1.8"/><text x="450" y="142" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">Revisar consolidado y</text><text x="450" y="154" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">validar excepciones</text><text x="379.0" y="172.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1b7a3d">&#128100;</text><rect x="546.0" y="241.0" width="158" height="62" rx="8" ry="8" fill="#eaf1fb" stroke="#1b4f9c" stroke-width="1.8"/><text x="625" y="254" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">Generar</text><text x="625" y="266" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">preliquidacion:</text><text x="625" y="278" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">vueltas por tarifa</text><text x="625" y="290" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">vigente</text><text x="554.0" y="296.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1b4f9c">&#9881;</text><rect x="721.0" y="437.0" width="158" height="62" rx="8" ry="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/><text x="800" y="456" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">Validar</text><text x="800" y="468" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">preliquidacion y</text><text x="800" y="480" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1f2933" text-anchor="middle">emitir factura</text><text x="729.0" y="492.0" font-family="Helvetica, Arial, san