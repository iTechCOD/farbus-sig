er-end="url(#ah)"/><path d="M1208,495 L1460,460" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#ahd)"/><path d="M1518,636 L1595,636" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#ahd)"/><path d="M1990,289 L1990,309" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#ahd)"/><rect x="90" y="730" width="430" height="72" rx="4" fill="#fdecea" stroke="#b42318" stroke-width="1" opacity="0.95"/><text x="98" y="746" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">El dato nace en papel. El</text><text x="98" y="758" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">conductor registra a mano horario,</text><text x="98" y="770" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">pasajeros, planta y paraderos; ese</text><text x="98" y="782" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">papel es la unica fuente de la</text><text x="98" y="794" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">operacion del dia.</text><rect x="560" y="730" width="430" height="72" rx="4" fill="#fdecea" stroke="#b42318" stroke-width="1" opacity="0.95"/><text x="568" y="746" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">Transcripcion manual. Cargar un</text><text x="568" y="758" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">dia completo de operacion de toda</text><text x="568" y="770" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">la flota toma aproximadamente una</text><text x="568" y="782" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">manana de trabajo (declaracion del</text><text x="568" y="794" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">representante legal).</text><rect x="1030" y="730" width="430" height="72" rx="4" fill="#fdecea" stroke="#b42318" stroke-width="1" opacity="0.95"/><text x="1038" y="746" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">Cuatro planillas Excel sin</text><text x="1038" y="758" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">integracion (Trafico, Vehiculos,</text><text x="1038" y="770" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">Sueldos y carga de combustible)</text><text x="1038" y="782" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">que se trasladan entre equipos</text><text x="1038" y="794" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">mediante pendrive.</text><rect x="1500" y="730" width="430" height="60" rx="4" fill="#fdecea" stroke="#b42318" stroke-width="1" opacity="0.95"/><text x="1508" y="746" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">El dato de pasajeros por vuelta y</text><text x="1508" y="758" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">el odometro por carga se capturan,</text><text x="1508" y="770" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">pero no se cruzan ni se usan como</text><text x="1508" y="782" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#b42318">control de gestion.</text><text x="1990" y="745" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1f2933">Leyenda</text><rect x="1990" y="750" width="18" height="12" rx="3" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/><text x="2015" y="759" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1f2933">Actividad</text><rect x="1990" y="767" width="18" height="12" rx="3" fill="#fdecea" stroke="#b42318" stroke-width="1.4"/><text x="2015" y="776" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1f2933">Punto critico</text></svg>